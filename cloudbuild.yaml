# Builds and pushes caveconnectome/materializationengine:$TAG_NAME.
#
# Layers are cached in the registry (the buildcache tag, mode=max so the dependency build
# stage is cached too). A release that changes only application code reuses every other
# layer: they keep their digests, so the push uploads only what changed (~1 MB) instead of
# every layer, and the slow steps (apt, compiling uwsgi, installing the Python dependencies)
# do not run. Changing uv.lock or the Dockerfile rebuilds from the first changed step.
steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    secretEnv: ["USERNAME", "PASSWORD"]
    args:
      - "-c"
      - |
        set -euo pipefail
        echo "$$PASSWORD" | docker login --username="$$USERNAME" --password-stdin
        # Registry cache export needs the docker-container driver, not the default docker one.
        docker buildx create --name cave-builder --driver docker-container --use
        docker buildx build \
          --platform linux/amd64 \
          --cache-from "type=registry,ref=$$USERNAME/materializationengine:buildcache" \
          --cache-to "type=registry,ref=$$USERNAME/materializationengine:buildcache,mode=max" \
          --tag "$$USERNAME/materializationengine:$TAG_NAME" \
          --push \
          .
    timeout: 1200s
options:
  # 8 vCPUs instead of the default 2: compiling uwsgi, unpacking wheels and compressing
  # layers for the push all run faster.
  machineType: "E2_HIGHCPU_8"
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/docker-password/versions/1
      env: "PASSWORD"
    - versionName: projects/$PROJECT_ID/secrets/docker-username/versions/1
      env: "USERNAME"
