[uwsgi]

module = run
callable = application
need-app = true
py-autoreload = 1
socket = /tmp/uwsgi.sock
chown-socket = nginx:nginx
chmod-socket = 664
; # Graceful shutdown on SIGTERM, see https://github.com/unbit/uwsgi/issues/849#issuecomment-118869386
hook-master-start = unix_signal:15 gracefully_kill_them_all

uid = nginx
gid = nginx

env = HOME=/home/nginx

stats = 0.0.0.0:9192
stats-http = true

### Worker scaling
# maximum number of workers
processes = 8

# https://uwsgi-docs.readthedocs.io/en/latest/Cheaper.html#busyness-cheaper-algorithm
cheaper-algo = busyness

# Time window for tracking average busyness
cheaper-overload = 20

# Number of idle cycles before stopping a worker
cheaper-busyness-multiplier = 3

# Minimum number of workers.
#
# 4 rather than 2 so /health does not queue behind a single busy worker. /health is served by this
# same pool, and the busyness algorithm only adds workers once the average over
# cheaper-overload * cheaper-busyness-multiplier (20 * 3 = 60s) exceeds cheaper-busyness-max,
# which was then 60.
# On 2026-08-17 a skeleton burst took the api from 12% to 50% busy, which is below that trigger, so
# it stayed at 2 workers with 6 of its 8 still unspawned. 50% of two workers is one occupied, and
# /health then missed its (then 1s) probe timeout on both replicas within one period, dropping the
# Service to zero endpoints and returning 503 for 3.5 minutes.
cheaper = 4

# Workers spawned at startup; matches the floor so a cold pod is not briefly thinner than a warm one.
cheaper-initial = 4

# Workers added at a time once the busyness trigger is crossed
cheaper-step = 4

# Start spawning more workers at 50% busyness. The 2026-08-17 burst peaked the 60s busyness
# average at ~50, which never crossed the previous 60 threshold, so the pool stayed at its
# floor while 6 of 8 workers went unspawned.
cheaper-busyness-max = 50

# Start killing workers if busyness falls below 20%
cheaper-busyness-min = 20


### Reloads and limitations
# max socket listen queue length - requires net.somaxconn increase
listen = 128

# Max request header size
buffer-size = 32768

# Don't spawn new workers if total memory over 6 GiB
cheaper-rss-limit-soft = 6442450944

# Reload worker after serving X requests
max-requests = 5000

# Grace period for single worker to reload/shutdown
worker-reload-mercy = 600

# Grace period for all workers and processes to reload/shutdown
reload-mercy = 605

# Kill stuck/unresponsive processes after 20 minutes
harakiri = 1200

### Misc
# Maintain Python thread support
enable-threads = true

# Required for cheaper-rss-limit-soft
memory-report = true

# Additional log output for harakiri
harakiri-verbose = true


### Logging
# Filter our own pre-formated app messages and pass them through
logger = applog stdio
log-route = applog "source":

# Wrap everything that looks like uWSGI in a single JSON+newline
logger = uWSGIlog stdio
log-route = uWSGIlog address space usage
log-route = uWSGIlog uwsgi
log-encoder = json:uWSGIlog {"source":"uWSGI","time":"${strftime:%Y-%m-%dT%H:%M:%S.000Z}","severity":"info","message":"${msg}"}
log-encoder = nl:uWSGIlog
